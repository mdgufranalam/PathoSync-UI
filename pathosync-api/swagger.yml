openapi: 3.0.3
info:
  title: Healthcare SaaS - Laboratory Test Management System API
  description: |
    API for a multi-tenant Laboratory Test Management System (India-focused).
    Use X-Tenant-ID header for tenant-specific operations and Bearer JWT for auth.
  version: "1.0.0"
servers:
  - url: https://your-api-domain.com/api/v1
    description: Production server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantHeader:
      name: X-Tenant-ID
      in: header
      description: Tenant UUID for multi-tenant requests (required for tenant-scoped endpoints)
      required: false
      schema:
        type: string
        format: uuid
    PaginationPage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number
    PaginationLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        default: 20
      description: Page size
  schemas:

    ErrorDetails:
      type: object
      additionalProperties: true
      description: Additional error details

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: AUTH_001
            message:
              type: string
              example: Invalid credentials
            details:
              $ref: '#/components/schemas/ErrorDetails'
            timestamp:
              type: string
              format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          description: Admin|Manager|Technician|Collection Agent|Data Entry|Viewer
        department:
          type: string
        joinDate:
          type: string
          format: date
        subscriptionPlan:
          type: string
          description: basic|starter|professional|enterprise
        organizationName:
          type: string
        tenantId:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        lastLogin:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - email
        - password
        - captcha
      properties:
        email:
          type: string
        password:
          type: string
        captcha:
          type: string
        rememberMe:
          type: boolean
          default: false

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            sessionId:
              type: string
              format: uuid
            expiresIn:
              type: integer
              description: seconds

    TokenRefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    TokenRefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer

    LogoutRequest:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid

    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationName:
          type: string
        domain:
          type: string
        subscriptionPlan:
          type: string
        subscriptionStatus:
          type: string
          enum: [active, trial, suspended, cancelled]
        subscriptionStartDate:
          type: string
          format: date
        subscriptionEndDate:
          type: string
          format: date
        billingInfo:
          type: object
          properties:
            billingEmail:
              type: string
              format: email
            address:
              type: string
            gstNumber:
              type: string
        settings:
          type: object
          properties:
            whatsappEnabled:
              type: boolean
            smsEnabled:
              type: boolean
            emailEnabled:
              type: boolean
            maxUsers:
              type: integer
            maxPatients:
              type: integer
        usage:
          type: object
          properties:
            currentUsers:
              type: integer
            currentPatients:
              type: integer
            monthlyBills:
              type: integer
            monthlyReports:
              type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    TenantsListResponse:
      type: object
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        pagination:
          $ref: '#/components/schemas/Pagination'

    PermissionRole:
      type: object
      properties:
        name:
          type: string
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    RolesResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/PermissionRole'

    PermissionCheckResponse:
      type: object
      properties:
        hasPermission:
          type: boolean
        permissions:
          type: array
          items:
            type: string

    Module:
      type: object
      properties:
        name:
          type: string
        permissions:
          type: array
          items:
            type: string

    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CreateUserRequest:
      type: object
      required:
        - name
        - email
        - role
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
        department:
          type: string
        password:
          type: string
        sendWelcomeEmail:
          type: boolean

    ActivityRecord:
      type: object
      properties:
        action:
          type: string
        timestamp:
          type: string
          format: date-time
        ipAddress:
          type: string
        userAgent:
          type: string
        resourceId:
          type: string

    UserActivityResponse:
      type: object
      properties:
        activities:
          type: array
          items:
            $ref: '#/components/schemas/ActivityRecord'

    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        country:
          type: string

    EmergencyContact:
      type: object
      properties:
        name:
          type: string
        relationship:
          type: string
        phone:
          type: string

    MedicalHistoryItem:
      type: object
      properties:
        condition:
          type: string
        diagnosedDate:
          type: string
          format: date
        status:
          type: string

    Insurance:
      type: object
      properties:
        provider:
          type: string
        policyNumber:
          type: string
        validUntil:
          type: string
          format: date

    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        alternatePhone:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        dateOfBirth:
          type: string
          format: date
        age:
          type: integer
        gender:
          type: string
        bloodGroup:
          type: string
        emergencyContact:
          $ref: '#/components/schemas/EmergencyContact'
        medicalHistory:
          type: array
          items:
            $ref: '#/components/schemas/MedicalHistoryItem'
        insurance:
          $ref: '#/components/schemas/Insurance'
        lastVisit:
          type: string
          format: date-time
        totalBills:
          type: integer
        totalAmount:
          type: number
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PatientListResponse:
      type: object
      properties:
        patients:
          type: array
          items:
            $ref: '#/components/schemas/Patient'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CreatePatientRequest:
      type: object
      required:
        - name
        - phone
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other]
        bloodGroup:
          type: string
        emergencyContact:
          $ref: '#/components/schemas/EmergencyContact'

    ParameterDefinition:
      type: object
      properties:
        name:
          type: string
        normalRange:
          type: string
        unit:
          type: string

    Test:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        shortName:
          type: string
        description:
          type: string
        category:
          type: string
        bodySystem:
          type: string
        testType:
          type: string
        price:
          type: number
        discountedPrice:
          type: number
        normalRange:
          type: object
          additionalProperties:
            type: string
        unit:
          type: string
        specimen:
          type: string
        specimenVolume:
          type: string
        fastingRequired:
          type: boolean
        reportingTime:
          type: string
        methodology:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ParameterDefinition'
        clinicalSignificance:
          type: string
        isActive:
          type: boolean
        popularityScore:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TestListResponse:
      type: object
      properties:
        tests:
          type: array
          items:
            $ref: '#/components/schemas/Test'
        pagination:
          $ref: '#/components/schemas/Pagination'

    PackageItem:
      type: object
      properties:
        testId:
          type: string
          format: uuid
        test:
          type: object
          properties:
            name:
              type: string
            price:
              type: number

    Package:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        tests:
          type: array
          items:
            $ref: '#/components/schemas/PackageItem'
        originalPrice:
          type: number
        packagePrice:
          type: number
        discount:
          type: number
        savings:
          type: number
        isPopular:
          type: boolean
        ageGroup:
          type: string
        gender:
          type: string
        fastingRequired:
          type: boolean
        reportingTime:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    PackageListResponse:
      type: object
      properties:
        packages:
          type: array
          items:
            $ref: '#/components/schemas/Package'

    BillItem:
      type: object
      properties:
        type:
          type: string
          description: test|package
        itemId:
          type: string
          format: uuid
        item:
          type: object
          properties:
            name:
              type: string
            price:
              type: number
        quantity:
          type: integer
        price:
          type: number
        discount:
          type: number

    Tax:
      type: object
      properties:
        cgst:
          type: number
        sgst:
          type: number
        total:
          type: number

    SampleCollection:
      type: object
      properties:
        type:
          type: string
          description: lab|home
        scheduledDate:
          type: string
          format: date-time
        collectedDate:
          type: string
          format: date-time
        collectorId:
          type: string
          format: uuid
        status:
          type: string
          description: scheduled|collected|pending

    Bill:
      type: object
      properties:
        id:
          type: string
        billNumber:
          type: string
        patientId:
          type: string
        patient:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            phone:
              type: string
            email:
              type: string
        doctorId:
          type: string
        doctor:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            specialization:
              type: string
        collectionCenter:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            address:
              type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/BillItem'
        subtotal:
          type: number
        discount:
          type: object
          properties:
            amount:
              type: number
            percentage:
              type: number
            reason:
              type: string
        tax:
          $ref: '#/components/schemas/Tax'
        total:
          type: number
        status:
          type: string
        paymentMethod:
          type: string
        paymentDetails:
          type: object
          properties:
            transactionId:
              type: string
            paidAmount:
              type: number
            paymentDate:
              type: string
              format: date-time
        sampleCollection:
          $ref: '#/components/schemas/SampleCollection'
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string

    BillsListResponse:
      type: object
      properties:
        bills:
          type: array
          items:
            $ref: '#/components/schemas/Bill'
        summary:
          type: object
          properties:
            totalBills:
              type: integer
            totalAmount:
              type: number
            paidAmount:
              type: number
            pendingAmount:
              type: number

    PaymentRequest:
      type: object
      required:
        - paymentMethod
        - amount
      properties:
        paymentMethod:
          type: string
        amount:
          type: number
        transactionId:
          type: string
        notes:
          type: string

    ReportTestResult:
      type: object
      properties:
        testId:
          type: string
        test:
          type: object
          properties:
            name:
              type: string
            normalRange:
              type: string
        result:
          type: string
        unit:
          type: string
        status:
          type: string
        remarks:
          type: string

    DescriptiveResult:
      type: object
      properties:
        testId:
          type: string
        test:
          type: object
          properties:
            name:
              type: string
        clinicalHistory:
          type: string
        grossExamination:
          type: string
        microscopicExamination:
          type: string
        diagnosis:
          type: string
        recommendations:
          type: string

    GroupResult:
      type: object
      properties:
        groupId:
          type: string
        group:
          type: object
          properties:
            name:
              type: string
        tests:
          type: array
          items:
            type: object
            properties:
              testId:
                type: string
              result:
                type: string
              status:
                type: string

    Report:
      type: object
      properties:
        id:
          type: string
        reportNumber:
          type: string
        patientId:
          type: string
        patient:
          type: object
          properties:
            name:
              type: string
            age:
              type: integer
            gender:
              type: string
        billId:
          type: string
        testResults:
          type: array
          items:
            $ref: '#/components/schemas/ReportTestResult'
        descriptiveResults:
          type: array
          items:
            $ref: '#/components/schemas/DescriptiveResult'
        groupResults:
          type: array
          items:
            $ref: '#/components/schemas/GroupResult'
        clinicalRemarks:
          type: string
        technician:
          type: object
          properties:
            name:
              type: string
            signature:
              type: string
        pathologist:
          type: object
          properties:
            name:
              type: string
            qualification:
              type: string
            signature:
              type: string
        status:
          type: string
        reportDate:
          type: string
          format: date-time
        verifiedDate:
          type: string
          format: date-time
        deliveredDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ReportListResponse:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/Report'

    Doctor:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        specialization:
          type: string
        qualification:
          type: string
        experience:
          type: string
        email:
          type: string
        phone:
          type: string
        licenseNumber:
          type: string
        hospitalAffiliation:
          type: string
        consultationFee:
          type: number
        address:
          type: object
        availability:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
              slots:
                type: array
                items:
                  type: string
        totalPatients:
          type: integer
        totalConsultations:
          type: integer
        rating:
          type: number
        isActive:
          type: boolean
        createdAt:
          type: string

    DoctorListResponse:
      type: object
      properties:
        doctors:
          type: array
          items:
            $ref: '#/components/schemas/Doctor'

    CollectionCenter:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        type:
          type: string
          enum: [main, satellite, home_collection]
        address:
          type: object
        contact:
          type: object
          properties:
            phone:
              type: string
            email:
              type: string
            manager:
              type: string
        operatingHours:
          type: object
        services:
          type: array
          items:
            type: string
        staff:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
              user:
                type: object
        coverage:
          type: object
          properties:
            areas:
              type: array
              items:
                type: string
            radius:
              type: string
        equipment:
          type: array
          items:
            type: string
        statistics:
          type: object
        isActive:
          type: boolean
        createdAt:
          type: string

    CollectionCenterListResponse:
      type: object
      properties:
        centers:
          type: array
          items:
            $ref: '#/components/schemas/CollectionCenter'

    DashboardStatistics:
      type: object
      properties:
        overview:
          type: object
        revenueAnalytics:
          type: object
        testAnalytics:
          type: object
        patientAnalytics:
          type: object
        operationalMetrics:
          type: object
        collectionCenters:
          type: array
          items:
            type: object

    Subscription:
      type: object
      properties:
        id:
          type: string
        plan:
          type: string
        status:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        billingCycle:
          type: string
        amount:
          type: number
        currency:
          type: string
        features:
          type: array
          items:
            type: string
        usage:
          type: object
        nextBillingDate:
          type: string
        autoRenewal:
          type: boolean

    WhatsAppMessageRequest:
      type: object
      properties:
        phone:
          type: string
        type:
          type: string
          enum: [text, image, document]
        message:
          type: string
        attachment:
          type: string

    SMSRequest:
      type: object
      properties:
        phone:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [notification, otp, marketing]

    EmailRequest:
      type: object
      properties:
        to:
          type: string
          format: email
        subject:
          type: string
        body:
          type: string
        attachments:
          type: array
          items:
            type: string

    File:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        originalName:
          type: string
        url:
          type: string
        size:
          type: integer
        mimeType:
          type: string
        category:
          type: string
        uploadedBy:
          type: string
        createdAt:
          type: string

    AuditLog:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        user:
          type: object
        action:
          type: string
        resource:
          type: string
        resourceId:
          type: string
        details:
          type: object
        ipAddress:
          type: string
        userAgent:
          type: string
        timestamp:
          type: string

  responses:
    Unauthorized:
      description: Authentication required / invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Bad request / validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

security:
  - bearerAuth: []

paths:

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login user with captcha and remember me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh-token:
    post:
      tags: [Authentication]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        "400":
          $ref: '#/components/responses/BadRequest'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout user and invalidate session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current user profile with permissions
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Initiate password reset
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        "200":
          description: Reset link sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset link sent to email

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password with token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                newPassword:
                  type: string
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset successful

  /tenants:
    get:
      tags: [Multi-Tenancy]
      summary: Get all tenants (Super Admin only)
      parameters:
